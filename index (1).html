s": ["Didáctica.", "De formación continua.", "Socioeducativa.", "Psicopedagógica."], "correct": 3}, {"topic": 2, "source": 149, "q": "Permite comprender cómo se ha realizado la investigación y las conclusiones obtenidas, y facilita a otros investigadores replicar la investigación:", "options": ["Paradigma de la investigación.", "Metodología de evaluación.", "Diseño de la investigación.", "Informe de la investigación."], "correct": 3}, {"topic": 2, "source": 150, "q": "Pretenden identificar variables independientes que expliquen una variable dependiente o endógena", "options": ["Estudios explicativos", "Estudios experimentales de laboratorio y de campo", "Estudios correlacionales", "Estudios masivos"], "correct": 1}, {"topic": 2, "source": 151, "q": "Proporciona cientos de tipos de piezas de todos los tamaños y colores con las que el estudiante puede diseñar y construir objetos en 3D:", "options": ["Educalab.", "Lego Digital Designer.", "Scratch.", "Área Tecnología."], "correct": 1}, {"topic": 2, "source": 152, "q": "Proporciona una lista de hitos o estándares para ayudar a los alumnos a convertirse en estudiantes competentes e independientes:", "options": ["El Centro Nacional de Información y Comunicación Educativa (CNICE)", "El Programa de Nuevas Tecnologías de la Información y la Comunicación (PNTIC)", "La Sociedad Internacional para la Tecnología en la Educación (ISTE)", "El Instituto Nacional de Tecnología Educativas y de Formación del Profesorado (INTEF)"], "correct": 2}, {"topic": 2, "source": 153, "q": "Se basa en considerar las reacciones de las personas que van a llevar a cabo el proceso de innovación, para adaptarlo en función de ellas:", "options": ["Desarrollo.", "Evaluación.", "Institucionalización", "Adopción o adaptación."], "correct": 3}, {"topic": 2, "source": 154, "q": "Se considera medio didáctico:", "options": ["cualquier recurso educativo elaborado con esa intención", "cualquier recurso que pueden emplearse en algún momento y contexto con una fu tica es", "options": ["La visión de la tecnología como herramienta educativa, no como fin para su investigación.", "La mayor carga lectiva.", "El menor protagonismo que se da a la tecnología y la informática en aplicación a otras materias con menos carga tecnológica o digital.", "El carácter troncal de las materias"], "correct": 0}, {"topic": 2, "source": 168, "q": "Una figura primordial e indispensable en los proyectos de innovación es:", "options": ["El director del centro.", "El jefe de departamento.", "Un asesor externo.", "El coordinador"], "correct": 3}];let test=[],answers=[],marked=new Set(),revealed=false;const $=id=>document.getElementById(id);$('bankCount').textContent=BANK.length;function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function make(){let pool=BANK.filter(x=>$('topic').value==='all'||String(x.topic)===$('topic').value);let mix=$('mix').value;if(mix==='both'||mix==='questions')pool=shuffle(pool);let n=$('count').value==='all'?pool.length:Math.min(+$('count').value,pool.length);test=pool.slice(0,n).map(x=>{let order=[0,1,2,3];if(mix==='both'||mix==='answers')order=shuffle(order);return {...x,order}});answers=Array(n).fill(null);marked=new Set();revealed=false;$('quiz').classList.remove('hidden');$('result').textContent='';render()}function render(){let root=$('questions');root.innerHTML='';test.forEach((x,i)=>{let card=document.createElement('div');card.className='card';card.id='q'+i;let meta=document.createElement('div');meta.className='meta';let num=document.createElement('span');num.textContent=`Pregunta ${i+1} de ${test.length}`;let source=document.createElement('span');source.textContent=`Tema ${x.topic} · Pregunta original ${x.source}`;meta.append(num,source);let h=document.createElement('h2');h.textContent=x.q;let box=document.createElement('div');x.order.forEach(idx=>{let lab=document.createElement('label');lab.className='option';if(revealed){if(idx===x.correct)lab.classList.add('correct');else if(answers[i]===idx)lab.classList.add('wrong')}let r=document.createElement('input');r.type='radio';r.name='ans'+i;r.checked=answers[i]===idx;r.onchange=()=>answers[i]=idx;lab.append(r,document.createTextNode(x.options[idx]));box.append(lab)});let mark=document.createElement('button');mark.style.width='auto';mark.textContent=marked.has(i)?'★ Marcada':'☆ Marcar';mark.onclick=()=>{marked.has(i)?marked.delete(i):marked.add(i);mark.textContent=marked.has(i)?'★ Marcada':'☆ Marcar'};card.append(meta,h,box,mark);root.append(card)})}$('create').onclick=make;$('correct').onclick=()=>{let ok=test.reduce((a,x,i)=>a+(answers[i]===x.correct),0),blank=answers.filter(x=>x===null).length;$('result').textContent=`Resultado: ${ok}/${test.length} correctas · ${test.length-ok-blank} incorrectas · ${blank} sin responder`;revealed=true;render();$('result').scrollIntoView({behavior:'smooth',block:'center'})};$('show').onclick=()=>{revealed=!revealed;render()};$('restart').onclick=()=>{answers=Array(test.length).fill(null);marked=new Set();revealed=false;$('result').textContent='';render();window.scrollTo({top:0,behavior:'smooth'})};function setTheme(d){document.body.classList.toggle('dark',d);$('themeBtn').textContent=d?'☀️ Modo claro':'🌙 Modo oscuro';localStorage.setItem('quiz-dark',d?'1':'0')}setTheme(localStorage.getItem('quiz-dark')==='1');$('themeBtn').onclick=()=>setTheme(!document.body.classList.contains('dark'));</script></main></body></html>
